name: CI
on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner OS
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      suite:
        description: Test suite
        required: true
        type: choice
        default: light
        options:
          - light
          - browser
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci --ignore-scripts --prefix runtime
      - run: npm test --prefix runtime
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Prepare pinned Chrome for browser tests
        if: inputs.suite == 'browser'
        shell: bash
        run: |
          node --input-type=module -e "import {chromePath} from './runtime/chrome.mjs'; import {appendFileSync} from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'DOZE_BROWSER_CHROME=' + await chromePath() + '\nDOZE_TEST_VIEWER=1\nDOZE_TEST_MANAGED_CHROME=1\n')"
      - run: cargo test --locked
        if: inputs.os != 'ubuntu-latest' || inputs.suite != 'browser'
      - run: xvfb-run -a cargo test --locked
        if: inputs.os == 'ubuntu-latest' && inputs.suite == 'browser'
