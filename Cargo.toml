[package]
name = "doze-bworser-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Project-scoped persistent Chrome for concurrent Codex browser tools."
license = "MIT"
repository = "https://github.com/mmng-a/doze-bworser-mcp"

[dependencies]
anyhow = "1"
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
interprocess = { version = "2.4.7", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
