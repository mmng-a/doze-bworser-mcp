[package]
name = "doze-bworser-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "One shared, lazily started Chromium for concurrent Codex browser tools."
license = "MIT"
repository = "https://github.com/mmng-a/doze-bworser-mcp"

[dependencies]
anyhow = "1"
axum = "0.8"
rmcp = { version = "3.8", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "signal", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
